version: "3.9"

# Production Docker Compose overrides
# Run with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  db:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M

  redis:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  backend:
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    volumes:
      - media_files:/app/media
      - static_files:/app/static
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M

  celery_worker:
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    volumes:
      - media_files:/app/media
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  celery_beat:
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  frontend:
    restart: always
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    command: node server.js
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M

  nginx:
    restart: always
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - static_files:/var/www/static:ro
      - media_files:/var/www/media:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  certbot_conf:
  certbot_www:
