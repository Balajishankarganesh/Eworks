[pytest]
DJANGO_SETTINGS_MODULE = config.settings.development
python_files = tests/test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --no-header -p no:warnings
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests requiring Redis/PostGIS
    websocket: marks WebSocket consumer tests
